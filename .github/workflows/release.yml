name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build BordoUI.zip
        run: git archive --format=zip --prefix=BordoUI/ -o BordoUI.zip "$GITHUB_REF_NAME"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" BordoUI.zip --title "Bordo UI $GITHUB_REF_NAME" --generate-notes
